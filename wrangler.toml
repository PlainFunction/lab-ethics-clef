name = "ethics-clef"
main = "src/index.ts"
compatibility_date = "2026-10-01"
# AsyncLocalStorage carries the current span across awaits.
compatibility_flags = ["nodejs_compat"]

# Every /judge is a paid model call, so nothing answers on workers.dev or preview
# URLs. To share it, add a custom domain route and put Cloudflare Access in front.
workers_dev = false
preview_urls = false

# Clef-flash runs on Workers AI. Needs the Workers Paid plan. Every call goes
# through AI Gateway: "default" (made on the first call) unless AI_GATEWAY_ID is set.
# [vars]
# AI_GATEWAY_ID = "ethics"

[ai]
binding = "AI"

# A spend cap: at most 10 judgements a minute, across everyone. Over it, /judge
# says so and calls nothing.
[[ratelimits]]
name = "JUDGE_LIMIT"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[observability]
enabled = true

# Traces to Tempo and logs to Loki: add OTLP destinations for each in the
# Cloudflare dashboard (Workers Observability), then name them below. Or set
# OTEL_EXPORTER_OTLP_ENDPOINT, and the secret OTEL_EXPORTER_OTLP_HEADERS, and
# the Worker exports both itself.
[observability.traces]
enabled = true
# destinations = ["grafana-tempo"]

[observability.logs]
enabled = true
invocation_logs = true
# destinations = ["grafana-loki"]
